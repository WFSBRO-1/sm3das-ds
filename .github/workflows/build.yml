name: build-nds
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -e
          EX=$(dirname "$(find $DEVKITPRO/examples/nds -name Makefile | head -1)")
          rm -rf proj && cp -r "$EX" proj
          mkdir -p proj/source proj/nitro
          cp source/main.c proj/source/main.c
          cp assets/*.bin proj/nitro/
          cd proj
          sed -i 's/-lnds9/-lfilesystem -lfat -lnds9/' Makefile
          make -k || true
          ls -la proj.elf
          ARM7=$(find $DEVKITPRO -iname "*arm7*.elf" | grep -i default | head -1)
          echo "arm7: $ARM7"
          $DEVKITPRO/tools/bin/ndstool -c ../ds_menu.nds -9 proj.elf -7 "$ARM7" -d nitro
          ls -la ../ds_menu.nds
      - uses: actions/upload-artifact@v4
        with:
          name: ds_menu
          path: ds_menu.nds
