name: build-nds
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq git >/dev/null
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recursive https://github.com/devkitPro/nds-hb-menu /tmp/hbmenu
          (cd /tmp/hbmenu && make 2>&1 | tail -5) || true
          EX=$(dirname "$(find $DEVKITPRO/examples/nds -name Makefile | head -1)")
          rm -rf proj && cp -r "$EX" proj
          mkdir -p proj/source proj/nitro
          cp source/main.c proj/source/main.c
          cp /tmp/hbmenu/source/nds_loader_arm9.c proj/source/
          cp /tmp/hbmenu/source/nds_loader_arm9.h proj/source/
          for h in load_bin.h bootstub_bin.h exceptionstub_bin.h; do
            f=$(find /tmp/hbmenu -name "$h" | head -1)
            if [ -n "$f" ]; then cp "$f" proj/source/; fi
          done
          cp assets/*.bin proj/nitro/
          echo "== loader files:"; ls proj/source
          cd proj
          sed -i 's/-lnds9/-lfilesystem -lfat -lnds9/' Makefile
          make
          find . -maxdepth 1 -name "*.nds" -exec cp {} ../Super_Mario_3D_All_Stars_DS.nds \;
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: Super_Mario_3D_All_Stars_DS
          path: Super_Mario_3D_All_Stars_DS.nds
