name: build-stock
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build stock example
        run: |
          set -e
          EX=$(find $DEVKITPRO/examples/nds -maxdepth 2 -iname "*hello*" -type d | head -1)
          echo "example: $EX"
          cp -r "$EX" /tmp/ex && cd /tmp/ex
          make
          mkdir -p $GITHUB_WORKSPACE/out
          find . -name "*.nds" | head -1 | xargs -I{} cp {} $GITHUB_WORKSPACE/out/stock.nds
      - uses: actions/upload-artifact@v4
        with:
          name: stock
          path: out/stock.nds
