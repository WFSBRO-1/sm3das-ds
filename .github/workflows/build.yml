name: build-nds
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -e
          EX=$(dirname "$(find $DEVKITPRO/examples/nds -name Makefile | head -1)")
          rm -rf proj && cp -r "$EX" proj
          mkdir -p proj/source proj/nitro
          cp source/main.c proj/source/main.c
          cp assets/*.bin proj/nitro/
          cd proj
          sed -i 's/-lnds9/-lfilesystem -lfat -lnds9/' Makefile
          make
          NDS=$(find . -maxdepth 1 -name "*.nds" | head -1)
          $DEVKITPRO/tools/bin/ndstool -x "$NDS" -9 arm9.bin -7 arm7.bin
          ICON=""
          if [ -f ../assets/icon.bmp ]; then ICON="-b ../assets/icon.bmp"; fi
          $DEVKITPRO/tools/bin/ndstool -c "Super_Mario_3D_All_Stars_DS.nds" \
            -9 arm9.bin -7 arm7.bin -d nitro \
            $ICON "Super Mario 3D All Stars DS;Sunshine / 64 / Galaxy;WFSBRO"
          mv "Super_Mario_3D_All_Stars_DS.nds" ../
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: Super_Mario_3D_All_Stars_DS
          path: Super_Mario_3D_All_Stars_DS.nds
