name: build-nds
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq git >/dev/null
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recursive https://github.com/devkitPro/nds-hb-menu /tmp/hbmenu
          (cd /tmp/hbmenu && make >/dev/null 2>&1) || true
          OBJS=""
          for o in bootstub.bin.o exceptionstub.bin.o load.bin.o; do
            f=$(find /tmp/hbmenu/build -name "$o" | head -1)
            OBJS="$OBJS $f"
          done
          NAME=Super_Mario_3D_All_Stars_DS
          EX=$(dirname "$(find $DEVKITPRO/examples/nds -name Makefile | head -1)")
          rm -rf $NAME && cp -r "$EX" $NAME
          mkdir -p $NAME/source $NAME/nitro
          cp source/main.c $NAME/source/main.c
          cp /tmp/hbmenu/source/nds_loader_arm9.c $NAME/source/
          cp /tmp/hbmenu/source/nds_loader_arm9.h $NAME/source/
          for h in load_bin.h bootstub_bin.h exceptionstub_bin.h; do
            f=$(find /tmp/hbmenu -name "$h" | head -1)
            if [ -n "$f" ]; then cp "$f" $NAME/source/; fi
          done
          cp assets/*.bin $NAME/nitro/
          if [ -f assets/icon.bmp ]; then cp assets/icon.bmp $NAME/icon.bmp; fi
          cd $NAME
          sed -i "s#-lnds9#$OBJS -lfilesystem -lfat -lnds9#" Makefile
          make ICON=$(pwd)/icon.bmp NITRO_FILES=$(pwd)/nitro TITLE="Super Mario 3D All Stars DS;Sunshine / 64 / Galaxy;WFSBRO"
          ls -la $NAME.nds
          cp $NAME.nds ../Super_Mario_3D_All_Stars_DS.nds
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: Super_Mario_3D_All_Stars_DS
          path: Super_Mario_3D_All_Stars_DS.nds
