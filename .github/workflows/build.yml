name: build-nds
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -e
          EX=$(dirname "$(find $DEVKITPRO/examples/nds -name Makefile | head -1)")
          rm -rf proj && cp -r "$EX" proj
          mkdir -p proj/source proj/nitro
          cp source/main.c proj/source/main.c
          cp assets/*.bin proj/nitro/
          ls -la proj/nitro
          cd proj
          sed -i 's/-lnds9/-lfilesystem -lfat -lnds9/' Makefile
          make NITRO_FILES=$(pwd)/nitro
          find . -name "*.nds" | head -1 | xargs -I{} cp {} ../ds_menu.nds
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: ds_menu
          path: ds_menu.nds
