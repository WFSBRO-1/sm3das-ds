name: build-nds
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq git >/dev/null
          git clone --depth 1 https://github.com/devkitPro/nds-hb-menu /tmp/hbmenu
          EX=$(dirname "$(find $DEVKITPRO/examples/nds -name Makefile | head -1)")
          rm -rf proj && cp -r "$EX" proj
          mkdir -p proj/source proj/nitro
          cp source/main.c proj/source/main.c
          cp /tmp/hbmenu/source/nds_loader_arm9.c proj/source/ || true
          cp /tmp/hbmenu/source/nds_loader_arm9.h proj/source/ || true
          cp /tmp/hbmenu/source/load_bin.h proj/source/ || true
          cp /tmp/hbmenu/source/bootstub_bin.h proj/source/ || true
          cp /tmp/hbmenu/source/exceptionstub_bin.h proj/source/ || true
          cp assets/*.bin proj/nitro/
          echo "== loader files:"; ls proj/source
          cd proj
          sed -i 's/-lnds9/-lfilesystem -lfat -lnds9/' Makefile
          make
          find . -maxdepth 1 -name "*.nds" -exec cp {} ../ds_menu.nds \;
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: ds_menu
          path: ds_menu.nds
